<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weatheronix</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
<body>
    <div class="top">
        <button id="btn1">🚩 Guntur</button>
        <div id="title">Weatheronix</div>
        <button id="btn2">⚙️</button>
    </div>
    <div>
        current temperature: <span id="temp">--</span>°C
    </div>
    <div>
        Air quality: <span id="aqi">--</span>
    </div>
    <div class="ctr">
        <div class="box1">
            <span>🔆</span>
            UV Index: <span id="uv">--</span>
        </div>
        <div class="box2" id="temp">
            <span>🌡</span>
            Temperature: <span id="temp2">--</span>°C
        </div>
        <div class="box3"     id="humidity">
            <span>💦</span>
            Humidity: <span id="humidity">--</span>%
        </div>
        <div class="box4" id="wind">
            <span>༄</span>
            Wind Speed: <span id="wind">--</span> m/s
        </div>
        <div class="box5" id="pressure">
            <span>🗜️</span>
            Pressure: <span id="pressure">--</span> hPa
        </div>
        <div class="box6" id="visibility">
            <span>👀</span>
            Visibility: <span id="visibility">--</span> m   
        </div>
    </div>
</body>
</html>
